
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Practical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Information System</h1>
        <p class="subtitle">GitHub Practical Project</p>

        <div class="form-box">
            <input type="text" id="name" placeholder="Enter Your Name">
            <input type="text" id="prn" placeholder="Enter Your PRN">
            <input type="text" id="branch" placeholder="Enter Your Branch">

            <button onclick="displayDetails()">Submit</button>
        </div>

        <div id="result" class="result">
            <h2>Student Details</h2>
            <p id="studentName"></p>
            <p id="studentPRN"></p>
            <p id="studentBranch"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
